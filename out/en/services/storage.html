t of your needs. The contract is deemed concluded upon receipt by the Provider of the quote dated and signed by the Client, accompanied, where applicable, by the requested deposit.\u003c/p\u003e\u003cp\u003eAny subsequent modification of the order must be the subject of a written amendment and may result in a price adjustment.\u003c/p\u003e\u003ch2\u003e3. Rates and Payment Terms\u003c/h2\u003e\u003cp\u003eOur rates are denominated in Swiss Francs (CHF) and are exclusive of tax, unless otherwise stated. Costs related to customs formalities or specific local taxes remain the responsibility of the Client.\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cstrong\u003eDeposit:\u003c/strong\u003e A deposit of 30% to 50% may be required upon signature to confirm the reservation of resources.\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eBalance:\u003c/strong\u003e The balance is payable upon receipt of the final invoice, according to the terms indicated thereon (generally within 10 or 30 days).\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eIn the event of late payment, default interest may be applied in accordance with prevailing rates.\u003c/p\u003e\u003ch2\u003e4. Execution of Services and Delivery\u003c/h2\u003e\u003cp\u003eWe undertake to execute the services with the utmost care, in accordance with \"Swiss Excellence\" quality standards.\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cstrong\u003eDeadlines:\u003c/strong\u003e Execution dates are set by mutual agreement. Although we make every effort to respect them, the Provider cannot be held responsible for delays due to external causes (customs, weather, force majeure).\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eAccess:\u003c/strong\u003e The Client must guarantee accessibility to the premises (departure and arrival) and report any technical difficulties (elevator, parking) in advance.\u003c/li\u003e\u003c/ul\u003e\u003ch2\u003e5. Insurance and Liability\u003c/h2\u003e\u003cp\u003eLA Global Corporation acts with absolute professional diligence.\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cstrong\u003eLiability:\u003c/strong\u003e We are liable in the event of proven damage resulting directly from our handling, within applicable legal limits.\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eInsurance:\u003c/strong\u003e We propose and strongly recommend subscribing to our \"All-Risk\" (Nail-to-Nail) insurance for valuables, fine art, and precious goods, offering optimal coverage beyond basic contractual liabilities.\u003c/li\u003e\u003c/ul\u003e\u003ch2\u003e6. Right of Withdrawal and Cancellation\u003c/h2\u003e\u003cp\u003eIn compliance with Swiss law, any cancellation by the Client must be notified in writing.\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cstrong\u003eMore than 30 days before the start:\u003c/strong\u003e The deposit may be partially refunded, minus administrative fees.\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eLess than 15 days:\u003c/strong\u003e The deposit remains with the Provider as compensation.\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eLess than 48 hours:\u003c/strong\u003e The full amount of the service may be due.\u003c/li\u003e\u003c/ul\u003e\u003ch2\u003e7. Data Protection (FADP / GDPR)\u003c/h2\u003e\u003cp\u003eWe treat your personal data (identity, addresses, inventory) with the strictest confidentiality, solely for the purposes of contract execution. In accordance with the Federal Act on Data Protection (FADP) and the GDPR if applicable, you have a right of access and rectification of your data.\u003c/p\u003e\u003ch2\u003e8. Applicable Law and Jurisdiction\u003c/h2\u003e\u003cp\u003eThese conditions are subject to \u003cstrong\u003eSwiss Law\u003c/strong\u003e. Any dispute relating to their interpretation or execution will be under the exclusive jurisdiction of the courts of the canton of \u003cstrong\u003eGeneva\u003c/strong\u003e, subject to appeal to the Federal Court.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"e:[\"$\",\"$ ual Team (EN, FR, DE, PT)\"},\"quote\":\"As service providers, our commitment is to deeply understand your requirements and offer comprehensive, bespoke, and reliable solutions. To achieve this, we employ recognised technologies, well-defined processes, and a high standard of execution, ensuring consistent results today — and readiness for tomorrow.\",\"founder\":\"Anderson Dias - Founder\"},\"ServicesSection\":{\"label\":\"Expertise\",\"title\":\"Specialised Services\",\"description\":\"We elevate your operation to a new level of excellence, attending to every detail for sophisticated and high-performance results.\",\"items\":{\"corporate\":{\"title\":\"Corporate Relocation\",\"subtitle\":\"Business Continuity\",\"description\":\"Seamless transition for corporate headquarters. Complete move management, minimising downtime with rigorous confidentiality protocols.\"},\"private\":{\"title\":\"Private Residence Logistics\",\"subtitle\":\"Estates \u0026 Properties\",\"description\":\"\\\"White-glove\\\" service for residences and estates. Comprehensive inventory management and recreation of the domestic atmosphere at the destination.\"},\"art\":{\"title\":\"Fine Art \u0026 Antiques\",\"subtitle\":\"Museum Standard\",\"description\":\"Bespoke climate-controlled crates, secure air conveyance, and professional installation for invaluable masterpieces.\"},\"cleaning\":{\"title\":\"Office Services\",\"subtitle\":\"Hygiene \u0026 Comfort\",\"description\":\"Immaculate environments, with attention to detail and total discretion, ensuring comfort and productivity for your team.\"},\"storage\":{\"title\":\"Secure Storage\",\"subtitle\":\"Vault \u0026 Asset Protection\",\"description\":\"Maximum security storage in freeports. Precision climate control for precious assets and temporary fiscal exemption.\"},\"events\":{\"title\":\"Exhibition \u0026 Event Setup\",\"subtitle\":\"Coordination \u0026 Precision\",\"description\":\"Flawless execution, attending to every detail to ensure visual impact, functionality, and punctuality.\"}}},\"AboutPage\":{\"hero\":{\"title\":\"The Great \\nMigration.\",\"description\":\"From the Golden Age of hospitality to modern corporate logistics. A legacy at the service of those who demand the impeccable.\"},\"chapter1\":{\"label\":\"Chapter I — 1924\",\"title\":\"The Winter \\nSeason.\",\"text\":{\"p1\":\"All excellence is born from a journey.\",\"p2\":\"LA Global began humbly, acting directly in the field, learning from every operation, every challenge, and every client. This constant contact with operational reality allowed the company to evolve consistently, accumulating experience in various environments — from residential to specialised logistics — until naturally reaching the corporate market.\",\"subtitle1\":\"Growth that breeds maturity\",\"p3\":\"This evolution, which we call The Great Migration, does not represent a rupture, but a maturation process. It is the transition from an agile structure to an organisation prepared to address corporate operations with precision, responsibility, and strategic vision.\",\"subtitle2\":\"Expertise built on practice\",\"p4\":\"Today, LA Global operates with clear methods, structured processes, and the capacity for anticipation. We understand that every company has its own challenges, distinct levels of requirement, and specific needs.\",\"p5\":\"It is this meticulous reading of the market that led to the creation of LA Global Corporate — a structure dedicated to professional projects of greater complexity, where rigour, confidentiality, and performance go hand in hand.\",\"quote\":\"LA Global's excellence is not a speech. It is the result of a path travelled.\"},\"caption\":\"Fig 1.0: Disembarkation of royal personal effects at Gstaad station (c. 1928).\"},\"chapter2\":{\"label\":\"Proprietary Methodology\",\"title\":\"The Vontobel Protocol\",\"description\":\"We adapt the precision of luxury hospitality to the complexity of modern logistics.\",\"features\":{\"visual_mapping\":{\"title\":\"Visual Mapping\",\"desc\":\"Before touching an object, we photograph and map the original layout. Every book, every pen returns to its exact place.\"},\"chain_responsibility\":{\"title\":\"Chain of Custody\",\"desc\":\"Inspired by diplomacy, our processes ensure that responsibility is never transferred to third parties. Absolute control.\"},\"operational_silence\":{\"title\":\"Operational Silence\",\"desc\":\"Our teams are trained to operate in occupied environments without causing noise or distraction. We are invisible.\"}}},\"chapter3\":{\"label\":\"Leadership\",\"title\":\"Masters of \\nCoordination.\",\"description\":\"Our management keeps the founders' spirit alive. We combine the discipline of Swiss engineering with the cultural sensitivity required to handle historical artefacts and corporate headquarters.\",\"roles\":{\"ops_director\":{\"role\":\"Anderson Dias Founder \u0026 CEO\",\"desc\":\"Creator of the vision that gave rise to the company, he leads with purpose, strategy, and a focus on real impact. He believes that strong businesses are built with innovation, dedication, and people committed to excellence.\"},\"curator\":{\"role\":\"Aline Camargo - Logistics Manager\",\"desc\":\"Responsible for planning, coordinating, and optimizing the company's logistics operations. She manages transport, warehousing, distribution, and inventory control, ensuring operational efficiency, cost reduction, and adherence to deadlines.\"},\"fleet_manager\":{\"role\":\"Emerson Santos – Operations Manager\",\"desc\":\"Responsible for process management and optimization, ensuring efficiency, organization, and operational excellence. He acts strategically to ensure that planning, execution, and results are always in perfect harmony.\"}}}},\"ServicesPage\":{\"header\":{\"title\":\"Our Divisions\",\"description\":\"Operational excellence tailored to the unique needs of global enterprises and grand private estates.\"},\"items\":{\"corporate\":{\"features\":{\"f1\":{\"name\":\"ISO 31000 Risk Management\",\"desc\":\"Rigorous protocols for risk identification and mitigation to ensure the absolute security of your assets at every stage.\"},\"f2\":{\"name\":\"Certified Asset Disposal\",\"desc\":\"Secure and eco-friendly process for data destruction and hardware recycling, with full compliance certificates.\"},\"f3\":{\"name\":\"\\\"Turnkey\\\" Operational Setup\",\"desc\":\"Complete installation and functional configuration of your new workspaces, ready for use from day one.\"},\"f4\":{\"name\":\"Specialised Transport\",\"desc\":\"Fleet of vehicles adapted for sensitive equipment, featuring air suspension and climate control.\"},\"f5\":{\"name\":\"Planning\",\"desc\":\"Detailed strategy and precise sequencing of operations to minimise impact on your business activity.\"},\"f6\":{\"name\":\"Relocation Coordination\",\"desc\":\"Centralised steering by a dedicated Project Manager, ensuring fluid communication and flawless execution.\"}}},\"private\":{\"features\":{\"f1\":{\"name\":\"Bespoke Packaging\",\"desc\":\"Made-to-measure protective materials and art packaging techniques for your most precious and delicate possessions.\"},\"f2\":{\"name\":\"Library Cataloguing\",\"desc\":\"Photographic inventory and methodical classification of your volumes, respecting their original organisation.\"},\"f3\":{\"name\":\"Interim Interior Design\",\"desc\":\"Aesthetic temporary arrangement to maintain your comfort during transition phases.\"},\"f4\":{\"name\":\"Personalised Installation\",\"desc\":\"Meticulous arrangement of your furniture and personal objects according to your exact preferences.\"},\"f5\":{\"name\":\"Fine Art \u0026 Antique Management\",\"desc\":\"Specialised expertise in the handling and preservation of invaluable collection pieces.\"},\"f6\":{\"name\":\"Administrative \u0026 Concierge Services\",\"desc\":\"Comprehensive assistance for administrative procedures and comfort services related to your change of residence.\"
