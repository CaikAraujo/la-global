p\u003eUnsere Leistungen unterliegen einem personalisierten Kostenvoranschlag, der nach einer genauen Bewertung Ihrer Bedürfnisse erstellt wird. Der Vertrag gilt als abgeschlossen, sobald der Dienstleister den vom Kunden datierten und unterzeichneten Kostenvoranschlag sowie gegebenenfalls die angeforderte Anzahlung erhalten hat.\u003c/p\u003e\u003cp\u003eJede nachträgliche Änderung der Bestellung bedarf einer schriftlichen Zusatzvereinbarung und kann zu einer Preisanpassung führen.\u003c/p\u003e\u003ch2\u003e3. Preise und Zahlungsbedingungen\u003c/h2\u003e\u003cp\u003eUnsere Preise verstehen sich in Schweizer Franken (CHF) und exklusive Steuern, sofern nicht anders angegeben. Kosten im Zusammenhang mit Zollformalitäten oder spezifischen lokalen Steuern gehen zu Lasten des Kunden.\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cstrong\u003eAnzahlung:\u003c/strong\u003e Eine Anzahlung von 30% bis 50% kann bei Vertragsunterzeichnung verlangt werden, um die Reservierung der Ressourcen zu bestätigen.\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eRestbetrag:\u003c/strong\u003e Der Restbetrag ist bei Erhalt der Schlussrechnung gemäß den dort angegebenen Bedingungen (in der Regel innerhalb von 10 oder 30 Tagen) fällig.\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eBei Zahlungsverzug können Verzugszinsen gemäß den geltenden Sätzen erhoben werden.\u003c/p\u003e\u003ch2\u003e4. Ausführung der Leistungen und Lieferung\u003c/h2\u003e\u003cp\u003eWir verpflichten uns, die Leistungen mit größter Sorgfalt und gemäß den Qualitätsstandards der «Schweizer Exzellenz» auszuführen.\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cstrong\u003eFristen:\u003c/strong\u003e Die Ausführungstermine werden einvernehmlich festgelegt. Obwohl wir alles daransetzen, diese einzuhalten, kann der Dienstleister nicht für Verzögerungen aufgrund externer Ursachen (Zoll, Wetter, höhere Gewalt) haftbar gemacht werden.\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eZugang:\u003c/strong\u003e Der Kunde muss die Zugänglichkeit der Räumlichkeiten (Abgang und Ziel) gewährleisten und etwaige technische Schwierigkeiten (Aufzug, Parkplätze) im Voraus melden.\u003c/li\u003e\u003c/ul\u003e\u003ch2\u003e5. Versicherung und Haftung\u003c/h2\u003e\u003cp\u003eLA Global Corporation handelt mit absoluter professioneller Sorgfalt.\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cstrong\u003eHaftung:\u003c/strong\u003e Unsere Haftung besteht für nachgewiesene Schäden, die direkt aus unserer Handhabung resultieren, im Rahmen der geltenden gesetzlichen Grenzen.\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eVersicherung:\u003c/strong\u003e Wir bieten an und empfehlen dringend den Abschluss unserer «All-Risk»-Versicherung (Nagel-zu-Nagel) für Wertsachen, Kunstwerke und kostbare Güter, die einen optimalen Schutz über die grundlegenden vertraglichen Haftungen hinaus bietet.\u003c/li\u003e\u003c/ul\u003e\u003ch2\u003e6. Widerrufsrecht und Stornierung\u003c/h2\u003e\u003cp\u003eIn Übereinstimmung mit dem Schweizer Recht muss jede Stornierung durch den Kunden schriftlich mitgeteilt werden.\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cstrong\u003eMehr als 30 Tage vor Beginn:\u003c/strong\u003e Die Anzahlung kann teilweise zurückerstattet werden, abzüglich Verwaltungskosten.\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eWeniger als 15 Tage:\u003c/strong\u003e Die Anzahlung verbleibt als Entschädigung beim Dienstleister.\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eWeniger als 48 Stunden:\u003c/strong\u003e Der gesamte Betrag der Leistung kann fällig werden.\u003c/li\u003e\u003c/ul\u003e\u003ch2\u003e7. Datenschutz (DSG / DSGVO)\u003c/h2\u003e\u003cp\u003eWir behandeln Ihre personenbezogenen Daten (Identität, Adressen, Inventar) streng vertraulich und ausschließlich zum Zwecke der Vertragsdurchführung. Gemäß dem Bundesgesetz über den Datenschutz (DSG) und der DSGVO, falls anwendbar, haben Sie ein Recht auf Zugang und Berichtigung Ihrer Daten.\u003c/p\u003e\u003ch2\u003e8. Anwendbares Recht und Gerichtsstand\u003c/h2\u003e\u003cp\u003eDiese Bedingungen unterliegen \u003cstrong\u003eSchweizerm Recht\u003c/strong\u003e. Für alle Streitigkeiten bezüglich ihrer Auslegung oder Ausführung sind ausschließlich die Gerichte des Kantons \u003cstrong\u003eGenf\u003c/strong\u003e zuständig, vorbehaltlich einer Beschwerde an das Bundesgericht.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"e:[\"$\",\"$Lf\",null,{\"formats\":\"$undefined\",\"locale\":\"de\",\"messages\":{\"Navbar\":{\"links\":{\"home\":\"Startseite\",\"services\":\"Dienstleistungen\",\"excellence\":\"L'Excellence\",\"contact\":\"Kontakt\"},\"logo_subtitle\":\"CORPORATE SOLUTIONS\",\"cta\":\"Kontaktieren Sie uns\"},\"Footer\":{\"consultation\":{\"title\":\"Beratung anfordern\",\"description\":\"Um Ihre logistischen Anforderungen diskret zu besprechen, kontaktieren Sie unser Team. Komplexe Projekte sind unsere Spezialität.\",\"cta\":\"Kontaktieren Sie uns\"},\"headquarters\":{\"title\":\"Hauptsitz\",\"address\":\"Av. des Communes-Réunies 43\\n1212 Grand-Lancy\\nSchweiz\"},\"legal\":{\"title\":\"Rechtliches\",\"privacy\":\"Datenschutzrichtlinie\",\"terms\":\"Allgemeine Geschäftsbedingungen\",\"insurance\":\"Versicherungen \u0026 Garantien\",\"portal\":\"Kundenportal\"},\"copyright\":\"© {year} L.A Global Corporation - Logistique Avancée. Alle Rechte vorbehalten.\",\"developer\":\"Entwickelt von Caik Araujo\",\"made_in\":\"Made in Suisse\"},\"TrustMarquee\":{\"partners\":{\"alinghi\":\"Alinghi Red Bull Racing\",\"sitag\":\"Sitag\",\"eca\":\"ECA\",\"cote\":\"Côté Magazine\",\"compass\":\"Compass Finance\",\"kassoe\":\"Kassoe Housing\",\"itten\":\"Itten+Brechbühl SA\",\"gelog\":\"Fondation Gelog\"}},\"Hero\":{\"title\":\"Die Kunst der Logistik\",\"subtitle\":\"im Dienste Ihrer Infrastruktur\",\"description\":\"Fortschrittliche Logistik und erstklassige Residenzen, mit absoluter Sorgfalt für Ihr Unternehmen.\",\"scroll\":\"Entdecken\"},\"AboutSection\":{\"label\":\"Institutionell\",\"title\":\"Willkommen bei LA GLOBAL \\nIhrem Partner für Lösungen\",\"description\":\"An die Zukunft zu denken, ist ein wesentlicher Bestandteil unserer Philosophie. Wir glauben, dass Innovation, Qualität und Verantwortung Hand in Hand gehen, um einen echten und nachhaltigen Wert für unsere Kunden zu schaffen. Wir handeln mit einer langfristigen Vision und entwickeln reale Lösungen für die Bedürfnisse unserer Kunden.\",\"certifications\":{\"iso\":\"ISO 27001 Zertifizierung\",\"insurance\":\"Vollkaskoversicherung \\\"All-Risk\\\"\",\"team\":\"Mehrsprachiges Team (EN, FR, DE, PT)\"},\"quote\":\"Als Dienstleister ist es unser Anspruch, Ihre Bedürfnisse tiefgreifend zu verstehen und umfassende, maßgeschneiderte und zuverlässige Lösungen anzubieten. Dafür arbeiten wir mit anerkannten Technologien, klar definierten Prozessen und einem hohen Ausführungsstandard, um konstante Ergebnisse für heute — und vorbereitet für morgen — zu garantieren.\",\"founder\":\"Anderson Dias - Gründer\"},\"ServicesSection\":{\"label\":\"Expertise\",\"title\":\"Spezialisierte Dienstleistungen\",\"description\":\"Wir heben Ihren Betrieb auf ein neues Exzellenzniveau und achten auf jedes Detail für anspruchsvolle und effiziente Ergebnisse.\",\"items\":{\"corporate\":{\"title\":\"Unternehmensumzug\",\"subtitle\":\"Business Continuity\",\"description\":\"Perfekter Übergang für Hauptsitze. Vollständiges Umzugsmanagement zur Minimierung von Ausfallzeiten unter Einhaltung strengster Vertraulichkeitsprotokolle.\"},\"private\":{\"title\":\"Logistik für Privatresidenzen\",\"subtitle\":\"Residenzen \u0026 Immobilien\",\"description\":\"\\\"White-Glove\\\"-Service für Residenzen und Anwesen. Vollständige Inventarverwaltung und Wiederherstellung der wohnlichen Atmosphäre am Zielort.\"},\"art\":{\"title\":\"Kunst \u0026 Antiquitäten\",\"subtitle\":\"Museumsstandard\",\"description\":\"Maßgeschneiderte klimatisierte Kisten, gesicherter Lufttransport und professionelle Installation für unschätzbare Kunstwerke.\"},\"cleaning\":{\"title\":\"Büroservice\",\"subtitle\":\"Hygiene und Komfort\",\"description\":\"Einwandfreie Umgebungen mit Liebe zum Detail und absoluter Diskretion, um Komfort und Produktivität für Ihr Team zu gewährleisten.\"},\"storage\":{\"title\":\"Sichere Lagerung\",\"subtitle\":\"Tresor \u0026 Vermögensschutz\",\"description\":\"Maximale Sicherheitslagerung in Freizonen. Präzisionsklimatisierung für wertvolle Vermögenswerte und vorübergehende Steuerbefreiung.\"},\"events\":{\"title\":\"Standbau für Messen und Events\",\"subtitle\":\"Koordination \u0026 Präzision\",\"description\":\"Tadellose Ausführung, bei der jedes Detail gepflegt wird, um visuelle Wirkung, Funktionalität und Pünktlichkeit zu garantieren.\"}}},\"AboutPage\":{\"hero\":{\"title\":\"Die Große \\nMigration.\",\"description\":\"Vom goldenen Zeitalter der Hotellerie bis zur modernen Unternehmenslogistik. Ein Erbe im Dienste derer, die das Makellose verlangen.\"},\"chapter1\":{\"label\":\"Kapitel I — 1924\",\"title\":\"Die Wintersaison.\",\"text\":{\"p1\":\"Jede Exzellenz entspringt einem Weg.\",\"p2\":\"LA Global begann bescheiden, direkt vor Ort agierend, lernend von jedem Einsatz, jeder Herausforderung und jedem Kunden. Dieser ständige Kontakt mit der operativen Realität ermöglichte es dem Unternehmen, sich konsequent weiterzuentwickeln und Erfahrungen in verschiedenen Bereichen — von Wohngebieten bis zur spezialisierten Logistik — zu sammeln, bis es natürlich den Unternehmensmarkt erreichte.\",\"subtitle1\":\"Ein Wachstum, das Reife hervorbringt\",\"p3\":\"Diese Entwicklung, die wir Die Große Migration nennen, stellt keinen Bruch dar, sondern einen Reifeprozess. Es ist der Übergang von einer agilen Struktur zu einer Organisation, die darauf vorbereitet ist, Unternehmensabläufe mit Präzision, Verantwortung und strategischer Vision zu bewältigen.\",\"subtitle2\":\"In der Praxis aufgebaute Expertise\",\"p4\":\"Heute arbeitet LA Global mit klaren Methoden, strukturierten Prozessen und der Fähigkeit zur Antizipation. Wir verstehen, dass jedes Unternehmen seine eigenen Herausforderungen, unterschiedlichen Anforderungen und spezifischen Bedürfnisse hat.\",\"p5\":\"Diese genaue Marktkenntnis führte zur Gründung von LA Global Corporate — einer Struktur, die hochkomplexen professionellen Projekten gewidmet ist, bei denen Strenge, Vertraulichkeit und Leistung Hand in Hand gehen.\",\"quote\":\"Die Exzellenz von LA Global ist kein bloßes Versprechen. Sie ist das Ergebnis eines gegangenen Weges.\"},\"caption\":\"Abb. 1.0: Entladung des königlichen persönlichen Eigentums am Bahnhof Gstaad (ca. 1928).\"},\"chapter2\":{\"label\":\"Eigene Methodik\",\"title\":\"Das Vontobel-Protokoll\",\"description\":\"Wir passen die Präzision der Luxushotellerie an die Komplexität der modernen Logistik an.\",\"features\":{\"visual_mapping\":{\"title\":\"Visuelles Mapping\",\"desc\":\"Bevor wir ein Objekt berühren, fotografieren und kartieren wir die ursprüngliche Anordnung. Jedes Buch, jeder Stift findet seinen exakten Platz wieder.\"},\"chain_responsibility\":{\"title\":\"Verantwortungskette\",\"desc\":\"Inspiriert von der Diplomatie garantieren unsere Prozesse, dass die Verantwortung niemals an Dritte übertragen wird. Absolute Kontrolle.\"},\"operational_silence\":{\"title\":\"Operative Stille\",\"desc\":\"Unsere Teams sind darauf geschult, in belebten Umgebungen zu arbeiten, ohne Lärm oder Ablenkung zu verursachen. Wir sind unsichtbar.\"}}},\"chapter3\":{\"label\":\"Führung\",\"title\":\"Meister der \\nKoordination.\",\"description\":\"Unsere Führung hält den Geist der Gründer lebendig. Wir kombinieren die Disziplin des Schweizer Engineerings mit der kulturellen Sensibilität, die für den Umgang mit historischen Artefakten und Unternehmenszentralen erforderlich ist.\",\"roles\":{\"ops_director\":{\"role\":\"Anderson Dias Founder \u0026 CEO\",\"desc\":\"Schöpfer der Vision, die dem Unternehmen zugrunde liegt; er führt mit Zielstrebigkeit, Strategie und Fokus auf echte Wirkung. Er glaubt, dass starke Unternehmen durch Innovation, Hingabe und Menschen, die sich der Exzellenz verschrieben haben, aufgebaut werden.\"},\"curator\":{\"role\":\"Aline Camargo - Logistikmanagerin\",\"desc\":\"Verantwortlich für die Planung, Koordination und Optimierung der logistischen Abläufe des Unternehmens. Sie managt Transport, Lagerung, Verteilung und Bestandsüberwachung und garantiert betriebliche Effizienz, Kostensenkung und Einhaltung von Fristen.\"},\"fleet_manager\":{\"role\":\"Emerson Santos – Betriebsleiter\",\"desc\":\"Verantwortlich für das Prozessmanagement und die Optimierung, um Effizienz, Organisation und operative Exzellenz zu gewährleisten. Er handelt strategisch, um sicherzustellen, dass Planung, Ausführung und Ergebnisse immer in perfekter Harmonie sind.\"}}}},\"ServicesPage\":{\"header\":{\"title\":\"Unsere Divisionen\",\"description\":\"Operative Exzellenz, angepasst an die einzigartigen Bedürfnisse globaler Unternehmen und großer Privatanwesen.\"},\"items\":{\"corporate\":{\"features\":{\"f1\":{\"name\":\"Risikomanagement ISO 31000\",\"desc\":\"Strenge Protokolle zur Risikoidentifikation und -minderung, um die absolute Sicherheit Ihrer Vermögenswerte bei jedem Schritt zu gewährleisten.\"},\"f2\":{\"name\":\"Zertifizierte Anlagenentsorgung\",\"desc\":\"Sicherer und ökologischer Prozess der Datenvernichtung und des Materialrecyclings mit vollständigen Konformitätszertifikaten.\"},\"f3\":{\"name\":\"Schlüsselfertige operative Einrichtung\",\"desc\":\"Vollständige Installation und funktionale Konfiguration Ihrer neuen Arbeitsräume, bereit für den Einsatz ab dem ersten Tag.\"},\"f4\":{\"name\":\"Spezialtransport\",\"desc\":\"Fahrzeugflotte für empfindliche Geräte, mit Luftfederung und Klimatisierung.\"},\"f5\":{\"name\":\"Planung\",\"desc\":\"Detaillierte Strategie und präzise Abfolge der Abläufe, um die Auswirkungen auf Ihre Geschäftstätigkeit zu minimieren.\"},\"f6\":{\"name\":\"Umzugskoordination\",\"desc\":\"Zentralisierte Steuerung durch einen dedizierten Projektleiter,
